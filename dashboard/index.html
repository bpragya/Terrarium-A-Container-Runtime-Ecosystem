<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrarium</title>
<style>
  :root {
    --panel: rgba(23, 35, 28, 0.78);
    --edge: rgba(255, 255, 255, 0.14);
    --text: #dfe9e2;
    --muted: #9fb5a8;
    --accent: #5fd08a;
    --danger: #e0685f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--text);
    background: #0f1712;
  }

  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  #stage {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  #title {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    width: 480px;
    height: 110px;
    overflow: visible;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.6));
  }
  #title text {
    font-size: 32px;
    font-weight: 700;
    fill: var(--text);
    font-family: inherit;
  }
  .animal {
    position: absolute;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
    font-size: 44px;
    line-height: 1;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.45));
    text-align: center;
    pointer-events: none;
    transition: opacity .4s ease;
  }
  .animal .label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
    margin-top: 2px;
  }
  .animal.sleeping { opacity: .55; }

  #panel {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 2;
    width: 220px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 12px;
    padding: 14px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  #panel .status {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #panel .status.offline { color: var(--danger); }
  #panel label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin: 8px 0 3px;
  }
  #panel input {
    width: 100%;
    background: rgba(0,0,0,.25);
    border: 1px solid var(--edge);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 7px;
    font: inherit;
  }
  #panel input:focus { outline: 1px solid var(--accent); }

  #preview {
    text-align: center;
    font-size: 32px;
    height: 40px;
    line-height: 40px;
    margin-top: 8px;
  }

  #commands {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
  #commands button {
    background: var(--accent);
    color: #0b140e;
    border: 0;
    padding: 9px 12px;
    border-radius: 7px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }
  #commands button.release { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  #commands button:disabled { opacity: .5; cursor: default; }

  #panelError {
    color: var(--danger);
    font-size: 12.5px;
    font-weight: 600;
    min-height: 1.2em;
    margin-top: 8px;
  }
  #panelError:not(:empty) {
    background: rgba(224, 104, 95, 0.15);
    border: 1px solid var(--danger);
    border-radius: 7px;
    padding: 6px 9px;
  }
</style>
</head>
<body>
<img id="bg" src="background.avif" alt="">
<div id="stage"></div>

<svg id="title" viewBox="0 0 480 110">
  <path id="titleArc" d="M 20,90 Q 240,10 460,90" fill="none" />
  <text text-anchor="middle">
    <textPath href="#titleArc" startOffset="50%">Pragya's Zoo</textPath>
  </text>
</svg>

<div id="panel">
  <div class="status" id="conn">connecting…</div>

  <label for="name">animal name</label>
  <input id="name" placeholder="e.g. lion" autocomplete="off">
  <div id="preview"></div>

  <label for="time">lifetime (ms)</label>
  <input id="time" type="number" min="1" value="20">

  <div id="commands">
    <button id="hatchBtn">Hatch</button>
    <button id="releaseBtn" class="release">Release</button>
  </div>
  <div id="panelError"></div>
</div>

<script>
const SPECIES = {
  lion: "\u{1F981}", tiger: "\u{1F42F}", bear: "\u{1F43B}", wolf: "\u{1F43A}",
  fox: "\u{1F98A}", elephant: "\u{1F418}", giraffe: "\u{1F992}", zebra: "\u{1F993}",
  monkey: "\u{1F412}", panda: "\u{1F43C}", koala: "\u{1F428}", rabbit: "\u{1F430}",
  deer: "\u{1F98C}", horse: "\u{1F434}", dog: "\u{1F415}", cat: "\u{1F408}",
  bird: "\u{1F426}", owl: "\u{1F989}", eagle: "\u{1F985}", snake: "\u{1F40D}",
  frog: "\u{1F438}", turtle: "\u{1F422}", fish: "\u{1F41F}", whale: "\u{1F433}",
  dolphin: "\u{1F42C}", shark: "\u{1F988}", octopus: "\u{1F419}", butterfly: "\u{1F98B}",
  bee: "\u{1F41D}", spider: "\u{1F577}", crab: "\u{1F980}", penguin: "\u{1F427}",
  kangaroo: "\u{1F998}", hippo: "\u{1F99B}", rhino: "\u{1F98F}", camel: "\u{1F42B}",
  cow: "\u{1F404}", pig: "\u{1F416}", sheep: "\u{1F411}", goat: "\u{1F410}",
  chicken: "\u{1F414}", duck: "\u{1F986}", bat: "\u{1F987}", mouse: "\u{1F401}",
  squirrel: "\u{1F43F}", hedgehog: "\u{1F994}", sloth: "\u{1F9A5}", otter: "\u{1F9A6}",
  peacock: "\u{1F99A}", parrot: "\u{1F99C}", flamingo: "\u{1F9A9}", ant: "\u{1F41C}",
};
const FALLBACK = "\u{1F41B}";

function speciesFor(name) {
  const n = String(name || "").trim().toLowerCase();
  if (!n) return null;
  if (SPECIES[n]) return SPECIES[n];
  const hit = Object.keys(SPECIES).find(key => n.includes(key));
  return hit ? SPECIES[hit] : FALLBACK;
}

// Random position/scale per creature, picked once and cached so it doesn't
// jump around on every 2s poll.
const placements = new Map();
function placementFor(name) {
  if (!placements.has(name)) {
    const x = 6 + Math.random() * 88;
    const y = 12 + Math.random() * 78;
    const scale = 0.55 + (y / 100) * 1.5; // lower on screen (closer) => bigger
    placements.set(name, { x, y, scale });
  }
  return placements.get(name);
}

const stage = document.getElementById("stage");
const conn = document.getElementById("conn");
const nameInput = document.getElementById("name");
const timeInput = document.getElementById("time");
const preview = document.getElementById("preview");
const hatchBtn = document.getElementById("hatchBtn");
const releaseBtn = document.getElementById("releaseBtn");
const panelError = document.getElementById("panelError");

function setConn(ok, text) {
  conn.textContent = text;
  conn.classList.toggle("offline", !ok);
}

nameInput.addEventListener("input", () => {
  const species = speciesFor(nameInput.value);
  preview.textContent = species || "";
});

// Hatch time per creature, tracked client-side so we can tell when its
// entered lifetime has elapsed (the backend has no timestamp column, and
// its own SLEEPING status means OOM-killed, not "time's up").
const hatchedAt = new Map();

function renderStage(creatures) {
  const visible = creatures.filter(c => c.status === "ALIVE" || c.status === "SLEEPING");
  stage.innerHTML = visible.map(c => {
    const { x, y, scale } = placementFor(c.name);
    const species = speciesFor(c.name);
    const start = hatchedAt.get(c.name);
    const timedOut = c.status === "ALIVE" && start != null && (Date.now() - start) >= c.mem_limit;
    const sleeping = c.status === "SLEEPING" || timedOut;
    const displayStatus = timedOut ? "SLEEPING" : c.status;
    return `
      <div class="animal${sleeping ? " sleeping" : ""}" style="left:${x}%; top:${y}%; --scale:${scale.toFixed(2)}"
           title="${escapeHtml(c.name)} — ${displayStatus} — ${c.mem_limit}ms">
        ${species}
        <span class="label">${escapeHtml(c.name)}</span>
      </div>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
  ));
}

async function poll() {
  try {
    const res = await fetch("/terrarium");
    if (res.status === 503) { renderStage([]); setConn(true, "live"); return; }
    if (!res.ok) throw new Error("HTTP " + res.status);
    renderStage(await res.json());
    setConn(true, "live");
  } catch (e) {
    setConn(false, "API offline");
  }
}

hatchBtn.addEventListener("click", async () => {
  panelError.textContent = "";
  const name = nameInput.value.trim();
  if (!name) { panelError.textContent = "enter an animal name"; return; }
  hatchBtn.disabled = true;
  try {
    const ms = Number(timeInput.value) || 20;
    // No cmd => isolate launches an interactive /bin/sh, which exits
    // immediately with no TTY attached. Run long-lived instead: the
    // entered lifetime only drives the client-side sleeping timer above,
    // not when the underlying process actually exits — it keeps running
    // (releasable at any time) until you hit Release.
    const res = await fetch("/terrarium/hatch", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, mem_limit_mb: ms, cmd: "sleep 86400" }),
    });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      throw new Error(detail.detail || ("HTTP " + res.status));
    }
    hatchedAt.set(name, Date.now());
    poll();
  } catch (e) {
    panelError.textContent = String(e.message || e);
  } finally {
    hatchBtn.disabled = false;
  }
});

releaseBtn.addEventListener("click", async () => {
  panelError.textContent = "";
  const name = nameInput.value.trim();
  if (!name) { panelError.textContent = "enter an animal name"; return; }
  releaseBtn.disabled = true;
  try {
    const res = await fetch(`/terrarium/${encodeURIComponent(name)}/release`, { method: "DELETE" });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      throw new Error(detail.detail || ("HTTP " + res.status));
    }
    poll();
  } catch (e) {
    panelError.textContent = String(e.message || e);
  } finally {
    releaseBtn.disabled = false;
  }
});

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
